name: Construir APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Configurar plugin OneSignal (gradle)
        run: |
          python3 - <<'EOF'
          p='android/build.gradle'
          s=open(p).read()
          if 'onesignal-gradle-plugin' not in s:
              s=s.replace('dependencies {', "dependencies {
        classpath 'gradle.plugin.com.onesignal:onesignal-gradle-plugin:[0.14.0, 0.99.99]'", 1)
              open(p,'w').write(s)
          p='android/app/build.gradle'
          s=open(p).read()
          if 'onesignal-gradle-plugin' not in s:
              s="apply plugin: 'com.onesignal.androidsdk.onesignal-gradle-plugin'
"+s
              open(p,'w').write(s)
          EOF

      - name: Sincronizar plugins con Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: despachos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
