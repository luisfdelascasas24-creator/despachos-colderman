function showToast(msg){
  const old=document.getElementById("appToast");
  if(old) old.remove();
  const el=document.createElement("div");
  el.id="appToast";
  el.className="toast";
  el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>{
    const t=document.getElementById("appToast");
    if(t) t.remove();
  },2600);
}

function normalizeText(v){
  return String(v||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.\-_/]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function slugify(v){
  return String(v||"archivo")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60) || "archivo";
}

function nowStamp(){ return Date.now(); }

function addHistory(despacho,tipo,nota=""){
  const historial=Array.isArray(despacho.historial)?despacho.historial:[];
  return [{
    ts:nowStamp(),
    fecha:new Date().toLocaleString("es-CL"),
    tipo,
    nota
  }, ...historial];
}

function openImageOverlay(src){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px";
  overlay.innerHTML=`<img src="${src}" style="max-width:100%;max-height:100%;border-radius:12px" /><button style="position:fixed;top:16px;right:16px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer">✕</button>`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}

function sanitizeName(v){
  return String(v||"")
    .replace(/\bFECHA\s+EMISI[OÓ]N\b.*$/i,"")
    .replace(/\bFECHA\b.*$/i,"")
    .replace(/\bRUT\b.*$/i,"")
    .replace(/\bGIRO\b.*$/i,"")
    .replace(/\bDIRECCI[OÓ]N\b.*$/i,"")
    .replace(/\bCOMUNA\b.*$/i,"")
    .replace(/\bCIUDAD\b.*$/i,"")
    .replace(/\bFORMA\s+DE\s+PAGO\b.*$/i,"")
    .replace(/\bFECHA\s+VENCIMIENTO\b.*$/i,"")
    .replace(/[|]/g," ")
    .replace(/\s{2,}/g," ")
    .trim();
}

function inferNombre(lines,text){
  let nombre="";
  for(let i=0;i<lines.length;i++){
    const l=lines[i].toUpperCase();
    if(/SE[NÑ]OR(?:ES)?|SENOR(?:ES)?|CLIENTE|DESTINATARIO|A NOMBRE|RAZON SOCIAL/.test(l)){
      let posible="";
      const partes=lines[i].split(/:\s*/);
      if(partes.length>1 && partes[1].trim().length>2){
        posible=partes.slice(1).join(":").trim();
      } else if(i+1<lines.length){
        posible=lines[i+1].trim();
      }
      posible=sanitizeName(posible);
      if(posible.length>4){
        nombre=posible;
        break;
      }
    }
  }
  if(!nombre){
    const likely=lines.find(x=>{
      const clean=x.toUpperCase();
      return /^[A-ZÁÉÍÓÚÑ0-9 .&-]{6,}$/.test(clean) &&
        !/(FACTURA|BOLETA|COTIZACION|COTIZACIÓN|RUT|FECHA|TOTAL|NETO|IVA|DIRECCION|DIRECCIÓN|FORMA DE PAGO|GIRO)/i.test(clean);
    });
    if(likely) nombre=sanitizeName(likely);
  }
  return nombre;
}

function inferRut(text,lines){
  let rut="";
  for(let i=0;i<lines.length;i++){
    const l=lines[i].toUpperCase();
    if(/^RUT[:\s]/.test(l)){
      const m=lines[i].match(/(\d{1,2}(?:\.\d{3}){2}-[\dkK]|\d{7,8}-[\dkK])/);
      if(m){ rut=m[1]; break; }
    }
  }
  if(!rut){
    const m=text.match(/\b(\d{1,2}(?:\.\d{3}){2}-[\dkK]|\d{7,8}-[\dkK])\b/);
    if(m) rut=m[1];
  }
  return rut;
}

function inferDocNumber(text){
  const patterns=[
    /(cotizaci[oó]n|cotizacion)[^\d]{0,12}(\d{3,12})/i,
    /(factura)[^\d]{0,12}(\d{3,12})/i,
    /(boleta)[^\d]{0,12}(\d{3,12})/i,
    /(n[°º.]|nro|numero|folio)[^\d]{0,12}(\d{3,12})/i
  ];
  for(const re of patterns){
    const m=text.match(re);
    if(m) return m[2];
  }
  return "";
}

function cleanDigits(v){ return String(v||"").replace(/[^\d]/g,""); }

function detectTrackingByAgency(text, agency){
  const raw=String(text||"");
  const compact=raw.replace(/\s+/g," ").trim();
  const upper=compact.toUpperCase();
  const justDigits=(s)=>cleanDigits(s);
  function matchDigits(re){
    const m=upper.match(re);
    return m ? justDigits(m[1]||m[0]) : "";
  }
  const ag=String(agency||"").toLowerCase();
  if(ag.includes("starken")){
    let v=matchDigits(/ORDEN\s+DE\s+FLETE(?:\s+NOMINATIVA)?\s*(?:N\.?|N[°º])?\s*([0-9.,]+)/i); if(v) return v;
    v=matchDigits(/NUMERO\s+DE\s+ORDEN\s+DE\s+FLETE\s*[:\-]?\s*([0-9.,]+)/i); if(v) return v;
  }
  if(ag.includes("chevallier")){
    let v=matchDigits(/(?:^|\s)(\d{10,14})(?:\s|$)/); if(v) return v;
  }
  if(ag.includes("varmont")){
    let v=matchDigits(/(?:^|\s)(\d{10,14})(?:\s|$)/); if(v) return v;
  }
  if(ag.includes("pdq")){
    let v=matchDigits(/M\.?R\.?\s*COURIER\s*([0-9]{6,10})/i); if(v) return v;
    v=matchDigits(/ORDEN\s+DE\s+PICK\s*UP.*?([0-9]{6,10})/i); if(v) return v;
    v=matchDigits(/(?:^|\s)([0-9]{6,10})(?:\s|$)/); if(v) return v;
  }
  if(ag.includes("rapid")){
    let v=matchDigits(/ODF\s*#\s*([0-9]{4,12})/i); if(v) return v;
    v=matchDigits(/CORR\.?\s*([0-9]{4,12})/i); if(v) return v;
  }
  if(ag.includes("chilexpress")){
    let v=matchDigits(/ORDEN\s+DE\s+TRANSPORTE\s*[:\-]?\s*([0-9]{8,16})/i); if(v) return v;
    v=matchDigits(/NRO\.?\s+DE\s+OPERACION\s*[:\-]?\s*([0-9]{4,12})/i); if(v) return v;
  }
  if(ag.includes("arriero")){
    let v=matchDigits(/CARTA\s+DE\s+PORTE\s*(?:N[°º])?\s*([0-9]{5,12})/i); if(v) return v;
  }
  if(ag.includes("fedex")){
    let v=matchDigits(/TRK#\s*([0-9 ]{8,20})/i); if(v) return v;
    v=matchDigits(/NUMERO\s+DE\s+GUIA\s*([0-9 ]{8,20})/i); if(v) return v;
    v=matchDigits(/N[ÚU]MERO\s+DE\s+GU[IÍ]A\s*([0-9 ]{8,20})/i); if(v) return v;
  }
  let v=matchDigits(/(?:TRK#|TRACKING|SEGUIMIENTO|GUIA|GU[IÍ]A|N[ÚU]MERO\s+DE\s+GUIA|NUMERO\s+DE\s+GUIA|ORDEN\s+DE\s+TRANSPORTE|ORDEN\s+DE\s+FLETE)\s*[:#N°º.-]*\s*([A-Z0-9 .,-]{5,24})/i);
  if(v) return v;
  const all=[...upper.matchAll(/\b\d{6,16}\b/g)].map(x=>x[0]);
  if(all.length){ all.sort((a,b)=>b.length-a.length); return all[0]; }
  return "";
}

// Comprime/redimensiona una imagen antes de subirla, para no llenar Storage/DB de fotos pesadas
function resizeImage(file,maxDim=1600,quality=0.75){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){
        if(width>height){ height=Math.round(height*(maxDim/width)); width=maxDim; }
        else { width=Math.round(width*(maxDim/height)); height=maxDim; }
      }
      const canvas=document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{ URL.revokeObjectURL(url); blob?resolve(blob):reject(new Error("No se pudo comprimir la imagen")); },"image/jpeg",quality);
    };
    img.onerror=e=>{ URL.revokeObjectURL(url); reject(e); };
    img.src=url;
  });
}

// Convierte un blob (ya comprimido) a base64 para guardarlo en Realtime Database
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

// Trae las fotos (docImg/ticketImgs) de un despacho desde el nodo separado "despachosImgs",
// usando caché en memoria para no volver a pedirlas si ya las tenemos.
async function fetchImgsNow(fbKey){
  if(!fbKey) return {docImg:"",ticketImgs:[]};
  state.imgCache=state.imgCache||{};
  if(state.imgCache[fbKey]) return state.imgCache[fbKey];
  if(!window._db) return {docImg:"",ticketImgs:[]};
  const snap=await window._db.ref("despachosImgs/"+fbKey).once("value");
  const v=snap.val()||{};
  const result={docImg:v.docImg||"",ticketImgs:Array.isArray(v.ticketImgs)?v.ticketImgs:(v.ticketImg?[v.ticketImg]:[])};
  state.imgCache[fbKey]=result;
  return result;
}

// Dispara la carga de fotos en segundo plano si el despacho tiene foto pero no la hemos traído aún,
// y vuelve a renderizar cuando lleguen (sin bloquear la vista mientras tanto).
function ensureImgsLoaded(d){
  if(!state.useFirebase || !d.fbKey) return;
  if(state.imgCache && state.imgCache[d.fbKey]) return;
  if(d.docImg || (Array.isArray(d.ticketImgs)&&d.ticketImgs.length) || d.ticketImg) return; // registro viejo, ya viene con las fotos incluidas
  const esperaFotos=d.hasDoc || (typeof d.ticketCount==="number" && d.ticketCount>0);
  if(!esperaFotos) return;
  state._imgFetching=state._imgFetching||{};
  if(state._imgFetching[d.fbKey]) return;
  state._imgFetching[d.fbKey]=true;
  fetchImgsNow(d.fbKey).finally(()=>{
    delete state._imgFetching[d.fbKey];
    if(state.view==="detalle" && state.selectedId===d.id) render();
  });
}

  return {docImg:d.docImg||"",ticketImgs:Array.isArray(d.ticketImgs)?d.ticketImgs:(d.ticketImg?[d.ticketImg]:[])};

// Carga Tesseract.js solo la primera vez que realmente se necesita (no al abrir la app)
let _tesseractLoadPromise=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(_tesseractLoadPromise) return _tesseractLoadPromise;
  _tesseractLoadPromise=new Promise((resolve,reject)=>{
    const t=document.createElement("script");
    t.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    t.onload=()=>resolve();
    t.onerror=()=>reject(new Error("No se pudo cargar el lector OCR"));
    document.head.appendChild(t);
  });
  return _tesseractLoadPromise;
}

async function ocrImage(file,lang="spa"){
  await loadTesseract();
  const {createWorker}=Tesseract;
  const worker=await createWorker(lang);
  const {data:{text}}=await worker.recognize(file);
  await worker.terminate();
  return text;
}

async function handleFile(file){
  if(!file) return;
  state.form.extractError=""; state.form.extractSuccess=""; state.form.extracting=true; state.form.statusMessage="Procesando captura..."; render(); setTimeout(bindNuevo,0);
  const reader=new FileReader();
  reader.onload=async e=>{
    state.form.imgPreview=e.target.result; render(); setTimeout(bindNuevo,0);
    try{
      const text=await ocrImage(file,"spa");
      const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
      const nombre=inferNombre(lines,text), rut=inferRut(text,lines), nDoc=inferDocNumber(text);
      if(nombre) state.form.nombre=nombre;
      if(rut) state.form.rut=rut;
      if(nDoc) state.form.nDoc=nDoc;
      state.form.extracting=false; state.form.statusMessage="";
      if(nombre || rut || nDoc){
        const found=[nombre?"nombre":"",rut?"RUT":"",nDoc?"N° documento":""].filter(Boolean).join(", ");
        state.form.extractSuccess=`✅ Datos encontrados: ${found}`;
      }else state.form.extractError="No se pudo extraer. Rellena manualmente.";
    }catch(err){ console.error(err); state.form.extracting=false; state.form.statusMessage=""; state.form.extractError="No se pudo extraer. Rellena manualmente."; }
    render(); setTimeout(bindNuevo,0);
  };
  reader.readAsDataURL(file);
}

async function guardar(){
  const f=state.form;
  if(!f.nombre.trim()){ showToast("Falta el nombre del cliente"); return; }
  if(f.destino==="provincia" && !f.agencia){ showToast("Selecciona una agencia para provincia"); return; }
  const dup=findPossibleDuplicate(f);
  if(dup){ const seguir=confirm(`Parece duplicado:\n${dup.nombre}${dup.nDoc?" · N° "+dup.nDoc:""}\n\n¿Guardar igual?`); if(!seguir) return; }

  let docImgUrl=f.imgPreview||"";
  // Comprimir la imagen antes de guardarla (sigue siendo base64, pero mucho más liviana)
  if(docImgUrl.startsWith("data:")){
    const btn=document.getElementById("btnGuardar"); if(btn){ btn.disabled=true; btn.textContent="Optimizando imagen..."; }
    try{
      const resp=await fetch(docImgUrl);
      const rawBlob=await resp.blob();
      const compressed=await resizeImage(rawBlob,1600,0.75);
      docImgUrl=await blobToDataURL(compressed);
    }catch(err){
      console.error("Error comprimiendo docImg",err);
      // si falla la compresión, se guarda igual la imagen original sin comprimir
    }
  }

  const existe=state.despachos.find(d=>d.id===f.id);
  const base={
    id:existe?f.id:Date.now(), fbKey:existe?(f.fbKey||existe.fbKey||""):(f.fbKey||""), ts:Date.now(), nombre:sanitizeName(f.nombre.trim()), rut:f.rut.trim(), nDoc:(f.nDoc||"").trim(), bultos:f.bultos||"", tracking:(f.tracking||"").trim(), docImg:docImgUrl, tipoCompra:f.tipoCompra, empresaNacional:f.empresaNacional, empresaNacionalCustom:(f.empresaNacionalCustom||"").trim(), destino:f.destino, agencia:f.agencia, agenciaCustom:(f.agenciaCustom||"").trim(), direccionDestino:(f.direccionDestino||"").trim(), region:f.region||"", notas:(f.notas||"").trim(), ticketImgs:Array.isArray(f.ticketImgs)?f.ticketImgs:(f.ticketImg?[f.ticketImg]:[]), ticketImg:(Array.isArray(f.ticketImgs)?f.ticketImgs[0]:f.ticketImg)||"", estado:existe?(f.estado||existe.estado||"pendiente"):"pendiente", fecha:existe?(f.fecha||existe.fecha):new Date().toLocaleDateString("es-CL"), historial:existe?addHistory(existe,"Despacho editado","Se actualizaron datos del despacho"):addHistory({historial:[]},"Despacho creado","Creación inicial")
  };
  if(existe){ dbActualizar(base); showToast("Despacho editado"); } else { dbGuardar(base); showToast("Despacho guardado"); }
  setState({view:"lista",form:emptyForm()});
}

    if(state.filtroFecha){ const fechaSel=new Date(state.filtroFecha+"T00:00:00").toLocaleDateString("es-CL"); arr=arr.filter(d=>d.fecha===fechaSel); }
    if(state.filtroAgencia) arr=arr.filter(d=>getAgencyLabel(d)===state.filtroAgencia);
    if(state.filtroExtra==="atrasados") arr=arr.filter(d=>d.estado==="pendiente" && d.fecha!==hoy);
    if(state.filtroExtra==="sin_ticket") arr=arr.filter(d=>d.estado==="entregado" && !ticketCountFor(d));
    if(state.filtroExtra==="nacional") arr=arr.filter(d=>d.tipoCompra==="nacional");
    if(state.filtroExtra==="importacion") arr=arr.filter(d=>d.tipoCompra==="importacion");
    if(state.busqueda.trim()){
      const q=normalizeText(state.busqueda);
      arr=arr.filter(d=>[
        d.nombre,d.rut,d.nDoc,d.tracking,d.agencia,d.agenciaCustom,d.direccionDestino,d.empresaNacional,d.empresaNacionalCustom,d.notas,getAgencyLabel(d)
      ].map(normalizeText).join(" ").includes(q));
    }
    return arr;
  })();

  const cards=filtrados.length===0 ? `<div class="empty">${state.despachos.length===0?"No hay despachos. Agrega el primero.":"Sin resultados."}</div>` : filtrados.map(d=>{
    const agenciaLabel=getAgencyLabel(d), empresaLabel=getEmpresaLabel(d), destinoLabel=d.destino==="provincia"?"Provincia":d.destino==="oficina"?"Oficina":"Bodega";
    const atrasado=d.estado==="pendiente" && d.fecha!==hoy; const ticketCount=ticketCountFor(d);
    return `
      <div class="card list-card soft-fade" data-id="${d.id}" style="border-color:${atrasado?"rgba(239,68,68,.25)":"rgba(255,255,255,.07)"}">
        <div class="list-card-top">
          <div style="flex:1;min-width:0">
            <div class="client-title">${d.nombre}</div>
            <div class="meta-line">
              ${d.rut?`<span class="meta-pill">🪪 ${d.rut}</span>`:""}
              ${d.nDoc?`<span class="meta-pill">📄 ${d.nDoc}</span>`:""}
              ${d.tracking?`<span class="meta-pill">🔎 ${d.tracking}</span>`:""}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
            ${badge(d.estado)}
            <div style="font-size:12px;color:${atrasado?"#ef4444":"#7b818b"};font-weight:700">${d.fecha||""}</div>
          </div>
        </div>

        <div class="list-card-grid">
          <div class="info-row">
            <div>🌍</div>
            <div><div class="info-label">Tipo</div><div class="info-value">${d.tipoCompra==="importacion"?"Importación":"Compra nacional"}</div></div>
          </div>
          <div class="info-row">
            <div>🚚</div>
            <div><div class="info-label">Agencia</div><div class="info-value">${agenciaLabel||"-"}</div></div>
          </div>
          <div class="info-row">
            <div>📍</div>
            <div><div class="info-label">Destino</div><div class="info-value">${destinoLabel}${d.direccionDestino?` · ${d.direccionDestino}`:""}</div></div>
          </div>
          <div class="info-row">
            <div>📦</div>
            <div><div class="info-label">Bultos</div><div class="info-value">${d.bultos||"-"}</div></div>
          </div>
          ${empresaLabel?`<div class="info-row"><div>🏭</div><div><div class="info-label">Empresa</div><div class="info-value">${empresaLabel}</div></div></div>`:""}
          ${d.notas?`<div class="info-row"><div>💬</div><div><div class="info-label">Notas</div><div class="info-value">${d.notas}</div></div></div>`:""}
        </div>

        <div class="card-footer">
          <div class="${ticketCount?"ticket-count":"ticket-none"}">${ticketCount?`🧾 ${ticketCount} ticket${ticketCount>1?"s":""}`:"🧾 Sin ticket"}</div>
          <button class="btn-secondary quick-wa" data-quickwa="${d.id}" style="padding:9px 12px;font-size:12px">📲 Enviar por WhatsApp</button>
        </div>
      </div>`;
  }).join("");

  return `
    <div class="header">
      <div class="brand-wrap">
        <div class="brand-title">📦 Despachos Colderman</div>
        <div class="brand-sub">${state.despachos.length} total · ${state.useFirebase?"🔄 sincronizado":"local"}</div>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" id="btnExport">Exportar</button>
        <button class="btn-main" id="btnNuevo">➕ Crear nuevo despacho</button>
      </div>
    </div>

    ${state.canInstall?`<div class="install-banner"><div class="install-banner-text"><strong>Instala la app</strong> y úsala como si fuera una app del celular.</div><button class="btn-install" id="btnInstallApp">📲 Instalar app</button></div>`:""}
    ${(state.notifSupported && state.notifPermission!=="granted")?`<div class="install-banner"><div class="install-banner-text"><strong>Activa las notificaciones</strong> y recibe un aviso cuando llegue un despacho nuevo, aunque la app esté cerrada.</div><button class="btn-install" id="btnActivarNotif">🔔 Activar</button></div>`:""}
    ${state.notifPermission==="granted"?`<div style="font-size:12px;color:#5cd65c;margin-bottom:10px">🔔 Notificaciones activadas</div>`:""}

    ${pendientesAtrasados.length>0?`<div class="banner warn">⚠️ Tienes <strong>${pendientesAtrasados.length}</strong> despacho${pendientesAtrasados.length>1?"s":""} pendiente${pendientesAtrasados.length>1?"s":""} de días anteriores</div>`:""}
    ${sinTicket.length>0?`<div class="banner info">🧾 Hay <strong>${sinTicket.length}</strong> despacho${sinTicket.length>1?"s":""} entregado${sinTicket.length>1?"s":""} sin ticket</div>`:""}

    <div class="dashboard-grid">
      <div class="dashboard-card"><div class="dashboard-num">${dash.total}</div><div class="dashboard-lbl">Total</div><div class="dashboard-hint">Todos los despachos</div></div>
      <div class="dashboard-card"><div class="dashboard-num">${dash.hoy}</div><div class="dashboard-lbl">Ingresados hoy</div><div class="dashboard-hint">Actividad del día</div></div>
      <div class="dashboard-card"><div class="dashboard-num" style="color:#f59e0b">${dash.atrasados}</div><div class="dashboard-lbl">Pendientes atrasados</div><div class="dashboard-hint">Revisar seguimiento</div></div>
      <div class="dashboard-card"><div class="dashboard-num" style="color:#10b981">${dash.sinTicket}</div><div class="dashboard-lbl">Entregados sin ticket</div><div class="dashboard-hint">Falta comprobante</div></div>
    </div>

    <div class="counters">
      ${Object.entries(ESTADOS).map(([k,v])=>`<div class="counter" id="cnt-${k}" style="border-color:${state.filtro===k?v.color:"rgba(255,255,255,.07)"};background:${state.filtro===k?v.bg:"linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02))"}"><div class="num" style="color:${v.color}">${c[k]}</div><div class="lbl">${v.label}</div></div>`).join("")}
    </div>

    <div class="filters-wrap">
      <div class="search-shell">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
          <div style="position:relative;flex:1;min-width:240px">
            <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#555;font-size:16px">🔍</span>
            <input id="searchInput" value="${state.busqueda||""}" placeholder="Buscar cliente, tracking o número de documento..." style="width:100%;background:#111214;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px 12px 13px 38px;color:#fff;font-size:14px;outline:none" />
          </div>
          <button class="chip ${state.filtroDia==="hoy"?"active":""}" id="btnHoy">📅 Hoy</button>
          <input type="date" id="filtroCalendario" value="${state.filtroFecha||""}" style="background:#111214;border:1px solid ${state.filtroFecha?"#e07b00":"rgba(255,255,255,.08)"};border-radius:14px;padding:12px 12px;color:${state.filtroFecha?"#e07b00":"#888"};font-size:14px;outline:none;cursor:pointer" />
          ${state.filtroFecha?`<button class="chip" id="btnLimpiarFecha">✕ Limpiar fecha</button>`:""}
          <select id="filtroAgencia" style="min-width:190px;background:#111214;border:1px solid ${state.filtroAgencia?"#e07b00":"rgba(255,255,255,.08)"};border-radius:14px;padding:12px 12px;color:${state.filtroAgencia?"#e07b00":"#888"};font-size:13px;outline:none">
            <option value="">🚚 Agencia...</option>
            ${[...new Set(state.despachos.map(d=>getAgencyLabel(d)).filter(Boolean))].map(a=>`<option value="${a}" ${state.filtroAgencia===a?"selected":""}>${a}</option>`).join("")}
          </select>
        </div>
        <div class="chips">
          <button class="chip ${state.filtroExtra==="atrasados"?"active":""}" id="chipAtrasados">Pendientes atrasados</button>
          <button class="chip ${state.filtroExtra==="sin_ticket"?"active":""}" id="chipSinTicket">Sin ticket</button>
          <button class="chip ${state.filtroExtra==="importacion"?"active":""}" id="chipImportacion">Importación</button>
          <button class="chip ${state.filtroExtra==="nacional"?"active":""}" id="chipNacional">Nacional</button>
          ${(state.filtroExtra||state.filtroAgencia||state.filtroFecha||state.filtroDia==="hoy"||state.filtro!=="todos")?`<button class="chip" id="chipLimpiarTodo">Limpiar filtros</button>`:""}
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="layout-main">${cards}</div>
      <div class="layout-side">
        <div class="summary-title">Resumen pendiente</div>
        ${(()=>{
          const pend=state.despachos.filter(d=>d.estado==="pendiente");
          const conteo={}; pend.forEach(d=>{ const key=getAgencyLabel(d)||"Sin agencia"; conteo[key]=(conteo[key]||0)+1; });
          if(Object.keys(conteo).length===0) return `<div class="mini-card" style="font-size:12px;color:#555;text-align:center">Sin pendientes</div>`;
          return Object.entries(conteo).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="resumen-item" data-agencia="${k}" style="background:${state.filtroAgencia===k?"#2a1f00":"#151518"};border-color:${state.filtroAgencia===k?"#e07b00":"rgba(255,255,255,.07)"}"><span style="font-size:12px;color:#ccc;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k}</span><span style="font-size:14px;font-weight:800;color:#e07b00;margin-left:6px">${v}</span></div>`).join("");
        })()}
      </div>
    </div>`;
}

function bindLista(){
  const btnInstall=document.getElementById("btnInstallApp");
  if(btnInstall) btnInstall.onclick=triggerInstall;
  document.getElementById("btnNuevo").onclick=()=>setState({view:"nuevo",form:emptyForm()});
  document.getElementById("btnExport").onclick=exportCSV;
  const btnActivarNotif=document.getElementById("btnActivarNotif");
  if(btnActivarNotif) btnActivarNotif.onclick=activarNotificaciones;
  Object.keys(ESTADOS).forEach(k=>{ document.getElementById("cnt-"+k).onclick=()=>setState({filtro:state.filtro===k?"todos":k}); });
  document.querySelectorAll(".card[data-id]").forEach(el=>{ el.onclick=(e)=>{ if(e.target.closest(".quick-wa")) return; setState({view:"detalle",selectedId:+el.dataset.id}); }; });
  document.querySelectorAll(".quick-wa").forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); const d=state.despachos.find(x=>x.id===+btn.dataset.quickwa); if(d) triggerQuickShare(d); }; });
  document.getElementById("searchInput").oninput=e=>{ state.busqueda=e.target.value; render(); setTimeout(bindLista,0); };
  document.getElementById("btnHoy").onclick=()=>setState({filtroDia:state.filtroDia==="hoy"?"todos":"hoy",filtroFecha:""});
  document.getElementById("filtroCalendario").onchange=e=>setState({filtroFecha:e.target.value,filtroDia:"todos"});
  document.getElementById("filtroAgencia").onchange=e=>setState({filtroAgencia:e.target.value});
  const x1=document.getElementById("btnLimpiarFecha"); if(x1) x1.onclick=()=>setState({filtroFecha:""});
  document.getElementById("chipAtrasados").onclick=()=>setState({filtroExtra:state.filtroExtra==="atrasados"?"":"atrasados"});
  document.getElementById("chipSinTicket").onclick=()=>setState({filtroExtra:state.filtroExtra==="sin_ticket"?"":"sin_ticket"});
  document.getElementById("chipImportacion").onclick=()=>setState({filtroExtra:state.filtroExtra==="importacion"?"":"importacion"});
  document.getElementById("chipNacional").onclick=()=>setState({filtroExtra:state.filtroExtra==="nacional"?"":"nacional"});
  const clearAll=document.getElementById("chipLimpiarTodo"); if(clearAll){ clearAll.onclick=()=>setState({filtro:"todos",filtroDia:"todos",filtroAgencia:"",filtroFecha:"",filtroExtra:""}); }
  document.querySelectorAll(".resumen-item").forEach(el=>{ el.onclick=()=>setState({filtroAgencia:state.filtroAgencia===el.dataset.agencia?"":el.dataset.agencia}); });
}

function renderNuevo(){
  const f=state.form, isEdit=!!f.id, isNacional=f.tipoCompra==="nacional", showEmpresaCustom=isNacional && f.empresaNacional==="Otra...", isProvincia=f.destino==="provincia", showAgenciaCustom=isProvincia && f.agencia==="Otra...";
  return `
    <div class="header"><button class="btn-back" id="btnBack">←</button><span style="font-weight:700;font-size:16px">${isEdit?"Editar despacho":"Nuevo Despacho"}</span><div style="width:40px"></div></div>
    <div class="page">
      <div class="upload-area" id="uploadArea" tabindex="0">${f.imgPreview?`<img src="${f.imgPreview}" alt="doc" />`:`<div style="font-size:34px">📎</div><div style="color:#ddd;font-size:14px;margin-top:8px;font-weight:700">Sube, arrastra o pega con Ctrl+V tu captura</div><div style="color:#777;font-size:12px;margin-top:6px">Factura, cotización o boleta</div>`}</div>

      ${f.extractError?`<div class="extract-error">${f.extractError}</div>`:""}
      <div class="field"><label>Nombre del cliente / empresa *</label><input id="fNombre" value="${f.nombre||""}" placeholder="Extraído o escribe aquí" /></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>RUT</label><input id="fRut" value="${f.rut||""}" placeholder="Ej: 12.345.678-9" /></div><div class="field"><label>N° Cotización / Factura / Boleta</label><input id="fNDoc" value="${f.nDoc||""}" placeholder="Ej: 5065" /></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Cantidad de bultos</label><input id="fBultos" type="number" min="1" value="${f.bultos||""}" placeholder="Ej: 3" /></div><div class="field"><label>Tracking</label><input id="fTracking" value="${f.tracking||""}" placeholder="Opcional / si ya lo tienes" /></div></div>
      <div class="section-sep">Tipo de compra</div>
      <div class="tabs"><div class="tab ${!isNacional?"active":""}" id="tabImport">🌏 Importación</div><div class="tab ${isNacional?"active":""}" id="tabNacional">🇨🇱 Compra nacional</div></div>
      ${isNacional?`<div class="field"><label>Empresa proveedora</label><select id="fEmpresaNacional"><option value="">Seleccionar empresa...</option>${EMPRESAS_NACIONAL.map(e=>`<option ${f.empresaNacional===e?"selected":""}>${e}</option>`).join("")}</select></div>${showEmpresaCustom?`<div class="field"><label>¿Cuál empresa?</label><input id="fEmpresaCustom" value="${f.empresaNacionalCustom||""}" placeholder="Nombre de la empresa" /></div>`:""}`:""}
      <div class="section-sep">Destino del envío</div>
      <div class="tabs"><div class="tab ${isProvincia?"active":""}" id="tabProvincia">📦 Provincia</div><div class="tab ${f.destino==="oficina"?"active":""}" id="tabOficina">🏢 Oficina</div><div class="tab ${f.destino==="bodega"?"active":""}" id="tabBodega">🏭 Bodega</div></div>
      ${isProvincia?`<div class="field"><label>Agencia de envío</label><select id="fAgencia"><option value="">Seleccionar agencia...</option>${AGENCIAS.map(a=>`<option ${f.agencia===a?"selected":""}>${a}</option>`).join("")}</select></div>${showAgenciaCustom?`<div class="field"><label>¿Cuál agencia?</label><input id="fAgenciaCustom" value="${f.agenciaCustom||""}" placeholder="Nombre de la agencia" /></div>`:""}<div class="field"><label>Dirección / sucursal de destino</label><input id="fDireccion" value="${f.direccionDestino||""}" placeholder="Ej: Sucursal Starken Talca, Av. O'Higgins 123" /></div>`:`<div style="background:#1a1a1a;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;color:#888">${f.destino==="oficina"?"🏢 El pedido se recibe en oficina.":"🏭 El pedido se recoge en bodega."}</div>`}

      <button class="btn-primary" id="btnGuardar" style="width:100%;padding:14px;font-size:16px;margin-bottom:10px">${isEdit?"Guardar cambios":"Guardar despacho"}</button>
      <div style="text-align:center;color:#666;font-size:12px">Tip: pega con <span class="kdb">Ctrl+V</span>, arrastra la imagen o haz clic para subir</div>
    </div>`;
}

function bindNuevo(){
  const re=()=>{ render(); setTimeout(bindNuevo,0); };
  document.getElementById("btnBack").onclick=()=>setState({view:"lista",form:emptyForm()});
  const uploadArea=document.getElementById("uploadArea"), fileInput=document.getElementById("fileInput");
  uploadArea.onclick=()=>fileInput.click();
  fileInput.onchange=e=>handleFile(e.target.files[0]);
  uploadArea.addEventListener("dragover",e=>{ e.preventDefault(); uploadArea.classList.add("dragover"); });
  uploadArea.addEventListener("dragleave",()=>uploadArea.classList.remove("dragover"));
  uploadArea.addEventListener("drop",e=>{ e.preventDefault(); uploadArea.classList.remove("dragover"); const file=e.dataTransfer.files?.[0]; if(file && file.type.startsWith("image/")) handleFile(file); });
  const onPasteNuevo=e=>{ const items=e.clipboardData?.items; if(!items) return; for(const item of items){ if(item.type.startsWith("image/")){ e.preventDefault(); handleFile(item.getAsFile()); break; } } };
  document.addEventListener("paste",onPasteNuevo); window._pasteNuevoCleanup=()=>document.removeEventListener("paste",onPasteNuevo);
  document.getElementById("fNombre").oninput=e=>{state.form.nombre=e.target.value;};
  document.getElementById("fRut").oninput=e=>{state.form.rut=e.target.value;};
  document.getElementById("fNDoc").oninput=e=>{state.form.nDoc=e.target.value;};
  document.getElementById("fBultos").oninput=e=>{state.form.bultos=e.target.value;};
  document.getElementById("fTracking").oninput=e=>{state.form.tracking=e.target.value;};
  document.getElementById("tabImport").onclick=()=>{state.form.tipoCompra="importacion";re();};
  document.getElementById("tabNacional").onclick=()=>{state.form.tipoCompra="nacional";re();};
  document.getElementById("tabProvincia").onclick=()=>{state.form.destino="provincia";re();};
  document.getElementById("tabOficina").onclick=()=>{state.form.destino="oficina";re();};
  document.getElementById("tabBodega").onclick=()=>{state.form.destino="bodega";re();};
  const fn=document.getElementById("fEmpresaNacional"); if(fn) fn.onchange=e=>{state.form.empresaNacional=e.target.value;re();};
  const fc=document.getElementById("fEmpresaCustom"); if(fc) fc.oninput=e=>{state.form.empresaNacionalCustom=e.target.value;};
  const fa=document.getElementById("fAgencia"); if(fa) fa.onchange=e=>{state.form.agencia=e.target.value;re();};
  const fac=document.getElementById("fAgenciaCustom"); if(fac) fac.oninput=e=>{state.form.agenciaCustom=e.target.value;};
  const fd=document.getElementById("fDireccion"); if(fd) fd.oninput=e=>{state.form.direccionDestino=e.target.value;};
  const fno=document.getElementById("fNotas"); if(fno) fno.oninput=e=>{state.form.notas=e.target.value;};
  document.getElementById("btnGuardar").onclick=guardar;
}

function renderDetalle(){
  const d=state.despachos.find(x=>x.id===state.selectedId); if(!d) return renderLista();
  ensureImgsLoaded(d);
  const empresaLabel=getEmpresaLabel(d), agenciaLabel=getAgencyLabel(d), destinoLabel=d.destino==="provincia"?"📦 Envío a provincia":d.destino==="oficina"?"🏢 Recepción en oficina":"🏭 Recojo en bodega";
  const imgs=getImgsFor(d);
  const cargandoImgs=!state.imgCache?.[d.fbKey] && (d.hasDoc||d.ticketCount>0) && !imgs.docImg && !imgs.ticketImgs.length;
  const docImg=imgs.docImg;
  const ticketImgs=imgs.ticketImgs;
  return `
    <div class="header"><button class="btn-back" id="btnBack">←</button><span style="font-weight:700;font-size:16px">Detalle</span><button class="btn-delete" id="btnDelete">🗑</button></div>
    <div class="page">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn-primary" id="btnEditar">✏️ Editar</button><button class="btn-secondary" id="btnShareOnlyText">💬 Texto</button></div>
      <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a2a2a"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px"><div><div style="font-size:18px;font-weight:800">${d.nombre}</div>${d.rut?`<div style="color:#888;font-size:13px">RUT: ${d.rut}</div>`:""}</div>${badge(d.estado)}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${d.nDoc?`<span class="pill">📄 N° ${d.nDoc}</span>`:""}${d.tracking?`<span class="pill">🚚 ${d.tracking}</span>`:""}${ticketImgs.length?`<span class="pill">🧾 ${ticketImgs.length} ticket${ticketImgs.length>1?"s":""}</span>`:`<span class="pill">🧾 Sin ticket</span>`}</div><div class="row"><span class="lbl">Tipo</span><span class="val">${d.tipoCompra==="importacion"?"🌏 Importación":"🇨🇱 Compra nacional"}</span></div>${empresaLabel?`<div class="row"><span class="lbl">Empresa</span><span class="val">${empresaLabel}</span></div>`:""}<div class="row"><span class="lbl">Destino</span><span class="val">${destinoLabel}</span></div>${agenciaLabel?`<div class="row"><span class="lbl">Agencia</span><span class="val">${agenciaLabel}</span></div>`:""}${d.direccionDestino?`<div class="row"><span class="lbl">Dirección</span><span class="val">${d.direccionDestino}</span></div>`:""}${d.region?`<div class="row"><span class="lbl">Región</span><span class="val">${d.region}</span></div>`:""}${d.bultos?`<div class="row"><span class="lbl">Bultos</span><span class="val">${d.bultos}</span></div>`:""}${d.notas?`<div class="row"><span class="lbl">Notas</span><span class="val">${d.notas}</span></div>`:""}<div class="row"><span class="lbl">Ingresado</span><span class="val">${d.fecha||""}</span></div></div>
      <div style="font-size:13px;color:#aaa;font-weight:700;margin:16px 0 10px">DOCUMENTO ORIGINAL</div>
      ${docImg?`<div class="gallery"><div class="thumb" data-doc-open="1"><img src="${docImg}" alt="Documento" /><div class="thumb-label">Documento</div></div></div>`:cargandoImgs?`<div style="color:#777;font-size:13px;margin-bottom:16px">⏳ Cargando foto...</div>`:`<div style="color:#555;font-size:13px;margin-bottom:16px">Sin documento adjunto.</div>`}
      <div style="font-size:13px;color:#aaa;font-weight:700;margin:16px 0 10px">CAMBIAR ESTADO</div>
      ${Object.entries(ESTADOS).map(([k,v])=>`<button class="btn-estado" data-estado="${k}" data-fbkey="${d.fbKey||""}" style="color:${v.color};border-color:${d.estado===k?v.color:"#333"};background:${d.estado===k?v.bg:"#1a1a1a"}">${d.estado===k?"✓ ":""}${v.label}</button>`).join("")}
      <div style="font-size:13px;color:#aaa;font-weight:700;margin:18px 0 10px">TRACKING</div>
      <div class="field" style="margin-bottom:12px">
        <label>Número de seguimiento</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="detalleTrackingInput" value="${d.tracking||""}" placeholder="Escribe o corrige el tracking" style="flex:1;min-width:220px" />
          <button id="btnGuardarTracking" class="btn-secondary" style="white-space:nowrap">Guardar</button>
        </div>
      </div>
      ${state.ticketStatusId===d.id && state.ticketStatusMessage?`<div class="banner ${state.ticketStatusType==="warn"?"warn":"info"}" style="margin:0 0 12px 0;max-width:none">${state.ticketStatusMessage}</div>`:""}
      <div style="font-size:13px;color:#aaa;font-weight:700;margin:18px 0 10px">TICKETS DE ENTREGA</div>
      ${ticketImgs.length?`<div class="gallery" style="margin-bottom:10px">${ticketImgs.map((img,idx)=>`<div class="thumb" data-ticket-open="${idx}"><img src="${img}" alt="Ticket ${idx+1}" /><div class="thumb-label">Ticket ${idx+1}</div></div>`).join("")}</div><div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button id="btnWhatsapp" class="btn-primary" style="background:#25D366">📲 WhatsApp</button><button id="btnDescargarTodo" class="btn-secondary">⬇️ Descargar ticket principal</button></div>`:cargandoImgs?`<div style="color:#777;font-size:13px;margin-bottom:10px">⏳ Cargando foto(s)...</div>`:`<div style="color:#555;font-size:13px;margin-bottom:10px">No hay foto del ticket aún.</div>`}
      <div class="upload-area" id="ticketUpload" style="margin-bottom:8px"><div style="font-size:24px">📷</div><div style="color:#ddd;font-size:13px;margin-top:4px;font-weight:700">${ticketImgs.length?"Agregar / cambiar ticket(s)":"Subir ticket(s)"}</div><div style="color:#777;font-size:12px;margin-top:6px">Puedes subir varias fotos. En FedEx, sube las 2.</div></div>
      <div style="text-align:center;font-size:12px;color:#555;margin-bottom:16px">o pega una imagen con <span class="kdb">Ctrl+V</span></div>
      <input type="file" id="ticketFileInput" accept="image/*" multiple capture="environment" style="display:none" />
      <div style="font-size:13px;color:#aaa;font-weight:700;margin:18px 0 10px">HISTORIAL</div>
      ${(Array.isArray(d.historial)&&d.historial.length)?d.historial.map(h=>`<div class="history-item"><div class="history-type">${h.tipo}</div>${h.nota?`<div class="history-note">${h.nota}</div>`:""}<div class="history-date">${h.fecha||""}</div></div>`).join(""):`<div style="color:#555;font-size:13px">Sin historial aún.</div>`}
    </div>`;
}

function bindDetalle(){
  const d=state.despachos.find(x=>x.id===state.selectedId); if(!d) return;
  const imgs=getImgsFor(d); const docImg=imgs.docImg; const ticketImgs=imgs.ticketImgs;
  document.getElementById("btnBack").onclick=()=>setState({view:"lista"});
  document.getElementById("btnDelete").onclick=()=>{ if(confirm("¿Eliminar este despacho?")) dbEliminar(state.selectedId,d?.fbKey); };
  document.getElementById("btnEditar").onclick=async()=>{
    const btn=document.getElementById("btnEditar"); const original=btn.textContent;
    btn.disabled=true; btn.textContent="Cargando...";
    const fresh=await fetchImgsNow(d.fbKey);
    setState({view:"nuevo",form:{...emptyForm(),...d,imgPreview:fresh.docImg||null,ticketImgs:[...fresh.ticketImgs],ticketImg:fresh.ticketImgs[0]||""}});
  };
  const btnText=document.getElementById("btnShareOnlyText"); if(btnText){ btnText.onclick=()=>window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(buildWhatsappMessage(d)),"_blank"); }
  const btnGuardarTracking=document.getElementById("btnGuardarTracking");
  if(btnGuardarTracking){
    btnGuardarTracking.onclick=()=>{
      const input=document.getElementById("detalleTrackingInput");
      const valor=String(input.value||"").trim();
      const nuevo={...d,tracking:valor,historial:addHistory(d,"Tracking editado",valor||"Tracking eliminado")};
      dbActualizar(nuevo);
      state.ticketStatusId=d.id;
      state.ticketStatusType="info";
      state.ticketStatusMessage=valor?`Tracking guardado: ${valor}`:"Tracking eliminado";
      render();
      setTimeout(bindDetalle,0);
    };
  }
  document.querySelectorAll("[data-doc-open]").forEach(el=>{ el.onclick=()=>openImageOverlay(docImg); });
  document.querySelectorAll("[data-ticket-open]").forEach(el=>{ const idx=+el.dataset.ticketOpen; el.onclick=()=>openImageOverlay(ticketImgs[idx]); });
  document.querySelectorAll(".btn-estado").forEach(btn=>{ btn.onclick=()=>{ const nuevoEstado=btn.dataset.estado; if(nuevoEstado==="entregado" && !ticketImgs.length){ const seguir=confirm("Este despacho se marcará como entregado sin ticket. ¿Continuar?"); if(!seguir) return; } dbEstado(state.selectedId,btn.dataset.fbkey,nuevoEstado); }; });
  const btnWa=document.getElementById("btnWhatsapp"); if(btnWa){ btnWa.onclick=async(e)=>{ e.preventDefault(); const mensaje=buildWhatsappMessage(d); try{ if(ticketImgs.length && navigator.share){ const files=[]; for(let i=0;i<ticketImgs.length;i++){ const res=await fetch(ticketImgs[i]); const blob=await res.blob(); files.push(new File([blob],filenameForTicket(d,i),{type:blob.type||"image/jpeg"})); } await navigator.share({text:mensaje,files}); } else if(navigator.share){ await navigator.share({text:mensaje}); } else { window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(mensaje),"_blank"); } }catch(err){ if(err.name!=="AbortError") window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(mensaje),"_blank"); }; }; }
  const btnDesc=document.getElementById("btnDescargarTodo"); if(btnDesc){ btnDesc.onclick=()=>{ if(ticketImgs.length){ const a=document.createElement("a"); a.href=ticketImgs[0]; a.download=filenameForTicket(d,0); a.click(); } else showToast("No hay ticket para descargar"); }; }
  document.getElementById("ticketUpload").onclick=()=>document.getElementById("ticketFileInput").click();
  document.getElementById("ticketFileInput").onchange=e=>guardarTickets(Array.from(e.target.files||[]));
  const onPaste=e=>{ const items=e.clipboardData?.items; if(!items) return; const files=[]; for(const item of items){ if(item.type.startsWith("image/")){ e.preventDefault(); files.push(item.getAsFile()); } } if(files.length) guardarTickets(files); };
  document.addEventListener("paste",onPaste); window._pasteCleanup=()=>document.removeEventListener("paste",onPaste);
}

async function guardarTickets(files){
  if(!files || !files.length) return;
  const d=state.despachos.find(x=>x.id===state.selectedId); if(!d) return;

  state.ticketStatusId=d.id;
  state.ticketStatusType="info";
  state.ticketStatusMessage="Subiendo ticket...";
  render();
  setTimeout(bindDetalle,0);

  const actuales=await fetchImgsNow(d.fbKey);
  let ticketImgsActuales=Array.isArray(actuales.ticketImgs)&&actuales.ticketImgs.length?[...actuales.ticketImgs]:(Array.isArray(d.ticketImgs)?[...d.ticketImgs]:(d.ticketImg?[d.ticketImg]:[]));
  const nuevasImgs=[];
  for(const file of files){
    if(!file.type.startsWith("image/")) continue;
    try{
      const compressed=await resizeImage(file,1600,0.75);
      const url=await blobToDataURL(compressed);
      nuevasImgs.push(url);
    }catch(err){
      console.error("Error comprimiendo ticket",err);
      state.ticketStatusId=d.id; state.ticketStatusType="error"; state.ticketStatusMessage="No se pudo procesar una de las fotos"; render(); setTimeout(bindDetalle,0);
    }
  }

  if(String(d.agencia||"").toLowerCase().includes("fedex")) ticketImgsActuales=[...ticketImgsActuales,...nuevasImgs].slice(0,2);
  else ticketImgsActuales=[...ticketImgsActuales,...nuevasImgs];

  let nuevo={...d,ticketImgs:ticketImgsActuales,ticketImg:ticketImgsActuales[0]||"",historial:addHistory(d,"Ticket guardado",`Se guardó ${nuevasImgs.length} ticket${nuevasImgs.length>1?"s":""}`)};
  dbActualizar(nuevo);

  state.ticketStatusId=d.id;
  state.ticketStatusType="info";
  state.ticketStatusMessage="Ticket guardado correctamente";
  render();
  setTimeout(bindDetalle,0);

  setTimeout(async()=>{
    state.ticketStatusId=d.id;
    state.ticketStatusType="info";
    state.ticketStatusMessage="Leyendo número de seguimiento...";
    render();
    setTimeout(bindDetalle,0);

    let trackingDetectado=String(nuevo.tracking||"").trim();
    for(const file of files){
      try{
        const text=await ocrImage(file,"spa");
        const tracking=detectTrackingByAgency(text, d.agencia==="Otra..."?d.agenciaCustom:d.agencia);
        if(tracking && !trackingDetectado) trackingDetectado=tracking;
        if(String(d.agencia||"").toLowerCase().includes("fedex") && tracking) trackingDetectado=tracking;
      }catch(err){
        console.log("No se pudo leer tracking de uno de los tickets",err);
      }
    }

    if(trackingDetectado && trackingDetectado!==String(nuevo.tracking||"").trim()){
      nuevo={...nuevo,tracking:trackingDetectado,historial:addHistory(nuevo,"Tracking detectado",trackingDetectado)};
      dbActualizar(nuevo);
      state.ticketStatusId=d.id;
      state.ticketStatusType="info";
      state.ticketStatusMessage=`Tracking detectado: ${trackingDetectado}`;
      render();
      setTimeout(bindDetalle,0);
      return;
    }

    if(!trackingDetectado){
      state.ticketStatusId=d.id;
      state.ticketStatusType="warn";
      state.ticketStatusMessage="No se pudo detectar automáticamente. Puedes escribir el tracking manualmente.";
      render();
      setTimeout(bindDetalle,0);
      return;
    }

    state.ticketStatusId=d.id;
    state.ticketStatusType="info";
    state.ticketStatusMessage=`Tracking listo: ${trackingDetectado}`;
    render();
    setTimeout(bindDetalle,0);
  },120);
}

async function activarNotificaciones(){
  if(!state.notifSupported){ showToast("Tu navegador no soporta notificaciones"); return; }
  const btn=document.getElementById("btnActivarNotif"); if(btn){ btn.disabled=true; btn.textContent="Activando..."; }
  try{
    const permiso=await Notification.requestPermission();
    state.notifPermission=permiso;
    if(permiso!=="granted"){ showToast("No diste permiso para las notificaciones"); render(); return; }
    if(!window._messaging){ showToast("No se pudo iniciar el servicio de notificaciones"); render(); return; }
    if(!VAPID_KEY || VAPID_KEY==="PON_AQUI_TU_VAPID_KEY"){ showToast("Falta configurar la clave VAPID"); render(); return; }
    const reg=await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Tiempo de espera agotado esperando el service worker")),10000))
    ]);
    const token=await window._messaging.getToken({vapidKey:VAPID_KEY, serviceWorkerRegistration:reg});
    if(token && window._db){
      await window._db.ref("fcmTokens/"+token).set({ts:Date.now()});
      showToast("🔔 Notificaciones activadas");
    }
  }catch(err){
    console.error("Error activando notificaciones",err);
    showToast("No se pudo activar las notificaciones");
  }
  render();
}

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;

  const swCode = `
    try{
      importScripts('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
      importScripts('https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js');
      firebase.initializeApp(${JSON.stringify(firebaseConfig)});
      const messaging = firebase.messaging();
      messaging.onBackgroundMessage((payload) => {
        const title = (payload.notification && payload.notification.title) || 'Despachos Colderman';
        const body = (payload.notification && payload.notification.body) || '';
        self.registration.showNotification(title, { body, icon: './icon.png' });
      });
    }catch(e){ /* mensajería no disponible en este navegador */ }

    self.addEventListener('notificationclick', event => {
      event.notification.close();
      event.waitUntil(
        clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
          for (const c of list) { if ('focus' in c) return c.focus(); }
          if (clients.openWindow) return clients.openWindow('./');
        })
      );
    });

    const CACHE_NAME = 'despachos-colderman-v1';
    const APP_SHELL = ['./'];

    self.addEventListener('install', event => {
      event.waitUntil(
        caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)).catch(() => Promise.resolve())
      );
      self.skipWaiting();
    });

    self.addEventListener('activate', event => {
      event.waitUntil(
        caches.keys().then(keys => Promise.all(keys.map(key => key !== CACHE_NAME ? caches.delete(key) : Promise.resolve())))
      );
      self.clients.claim();
    });

    self.addEventListener('fetch', event => {
      const req = event.request;
      if (req.method !== 'GET') return;

      event.respondWith(
        fetch(req)
          .then(res => {
            const copy = res.clone();
            caches.open(CACHE_NAME).then(cache => cache.put(req, copy)).catch(() => {});
            return res;
          })
          .catch(() => caches.match(req).then(cached => cached || caches.match('./')))
      );
    });
  `;

  const blob = new Blob([swCode], { type: 'text/javascript' });
  const swUrl = URL.createObjectURL(blob);

  navigator.serviceWorker.register(swUrl).catch(() => {
    console.log('No se pudo registrar service worker');
  });
}

setupDynamicManifest();
setupInstallPrompt();
registerServiceWorker();
if(window._firebaseReady) initStorage(); else { window.addEventListener("firebaseReady",initStorage); setTimeout(initStorage,3000); }
</script>
