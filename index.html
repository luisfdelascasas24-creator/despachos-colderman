  <style>

    :root{
      --bg:#0f0f0f;
      --panel:#1a1a1a;
      --panel2:#202020;

      border-bottom:1px solid var(--line);

    .btn-secondary{background:#252525;color:#fff;border:1px solid var(--line2)}

    .btn-ghost{background:none;color:#aaa;border:1px solid var(--line2)}
    .btn-back{background:none;border:none;color:#aaa;font-size:22px;cursor:pointer;padding:4px 8px}
    .btn-delete{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer}
    .btn-estado{

      border:1px solid var(--line2);transition:.18s transform,.18s background,.18s border-color
    }
    .btn-primary:active,.btn-secondary:active,.btn-danger:active,.btn-ghost:active,.btn-estado:active,.card:active,.counter:active,.chip:active,.mini-card:active{transform:scale(.985)}
    .field{margin-bottom:14px}
    .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
    .field input,.field select,.field textarea{

    .card,.mini-card,.dashboard-card{

    }

    .counters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 16px 0;max-width:1000px;margin:0 auto}

    .counter .lbl{font-size:10px;color:var(--muted);margin-top:2px}

    .layout{display:flex;gap:12px;align-items:flex-start;max-width:1000px;margin:0 auto;padding:12px 16px 16px}

      .counters{grid-template-columns:1fr 1fr 1fr}

  </style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:40px;color:#888">Cargando...</div></div>

<script>
const REGIONES=["Arica y Parinacota","Tarapacá","Antofagasta","Atacama","Coquimbo","Valparaíso","Región Metropolitana","O'Higgins","Maule","Ñuble","Biobío","La Araucanía","Los Ríos","Los Lagos","Aysén","Magallanes"];
const AGENCIAS=["Starken","Varmont","PDQ","Chevallier","FedEx","Chilexpress","RapidCargo","Uber Envíos","Infante","Otra..."];
const EMPRESAS_NACIONAL=["Blescom","American Air","Esmeralda","Otra..."];
const ESTADOS={
  pendiente:{label:"Pendiente",color:"#f59e0b",bg:"#2a1f00"},
  entregado:{label:"Entregado ✓",color:"#10b981",bg:"#002a1a"},
  falta_doc:{label:"Falta documento",color:"#ef4444",bg:"#2a0000"},
};

const emptyForm=()=>({
  id:null,
  fbKey:"",
  nombre:"",
  rut:"",
  nDoc:"",
  bultos:"",
  tracking:"",
  tipoCompra:"importacion",
  empresaNacional:"",
  empresaNacionalCustom:"",
  destino:"provincia",
  agencia:"",
  agenciaCustom:"",
  direccionDestino:"",
  region:"",
  notas:"",
  imgPreview:null,
  extracting:false,
  extractError:"",
  extractSuccess:"",
  statusMessage:"",
  ticketImg:"",
  fecha:"",
  estado:"pendiente",
  historial:[]
});

let toastTimeout=null;

let state={
  despachos:[],
  view:"lista",
  selectedId:null,
  filtro:"todos",
  busqueda:"",
  filtroDia:"todos",
  filtroAgencia:"",
  filtroFecha:"",
  filtroExtra:"",
  form:emptyForm(),
  useFirebase:false
};

function showToast(msg){
  const old=document.getElementById("appToast");
  if(old) old.remove();
  const el=document.createElement("div");
  el.id="appToast";
  el.className="toast";
  el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>{
    const t=document.getElementById("appToast");
    if(t) t.remove();
  },2600);
}

function normalizeText(v){
  return String(v||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[.\-_/]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function formatDateCL(date){
  return new Date(date).toLocaleDateString("es-CL");
}

function formatDateInputFromCL(clDate){
  if(!clDate) return "";
  const parts=clDate.split("/");
  if(parts.length!==3) return "";
  const [dd,mm,yyyy]=parts;
  return `${yyyy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
}

function slugify(v){
  return String(v||"archivo")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60) || "archivo";
}

function nowStamp(){
  return Date.now();
}

function addHistory(despacho,tipo,nota=""){
  const historial=Array.isArray(despacho.historial)?despacho.historial:[];
  return [
    {
      ts:nowStamp(),
      fecha:new Date().toLocaleString("es-CL"),
      tipo,
      nota
    },
    ...historial
  ];
}

// ── FIREBASE ──────────────────────────────────────────────────────────────────
function initStorage(){
  if(window._firebaseReady && window._db){
    state.useFirebase=true;
    window._db.ref("despachos").on("value",snap=>{
      const val=snap.val();
      state.despachos=val?Object.entries(val).map(([k,v])=>({...v,fbKey:k})):[];
      state.despachos.sort((a,b)=>(b.ts||0)-(a.ts||0));
      render();
    });
  } else {
    try{
      state.despachos=JSON.parse(localStorage.getItem("dcold")||"[]");
    }catch{
      state.despachos=[];
    }
    render();
  }
}
function saveLocal(){
  localStorage.setItem("dcold",JSON.stringify(state.despachos));
}
function dbGuardar(d){
  if(state.useFirebase){
    const payload={...d};
    delete payload.fbKey;
    window._db.ref("despachos").push(payload);
  }else{
    state.despachos=[d,...state.despachos];
    saveLocal();
    render();
  }
}
function dbActualizar(d){
  if(state.useFirebase && d.fbKey){
    const payload={...d};
    delete payload.fbKey;
    window._db.ref("despachos/"+d.fbKey).set(payload);
  }else{
    state.despachos=state.despachos.map(x=>x.id===d.id?d:x);
    saveLocal();
    render();
  }
}
function dbEstado(id,fbKey,estado){
  const d=state.despachos.find(x=>x.id===id);
  if(!d) return;
  const nuevo={
    ...d,
    estado,
    historial:addHistory(d,"Estado cambiado",estado)
  };
  if(state.useFirebase && fbKey){
    const payload={...nuevo};
    delete payload.fbKey;
    window._db.ref("despachos/"+fbKey).set(payload);
  }else{
    state.despachos=state.despachos.map(x=>x.id===id?nuevo:x);
    saveLocal();
    render();
  }
  showToast("Estado actualizado");
}
function dbEliminar(id,fbKey){
  if(state.useFirebase && fbKey){
    window._db.ref("despachos/"+fbKey).remove();
  }else{
    state.despachos=state.despachos.filter(d=>d.id!==id);
    saveLocal();
  }
  setState({view:"lista",selectedId:null});
  showToast("Despacho eliminado");
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function setState(p){
  if(window._pasteCleanup){window._pasteCleanup();window._pasteCleanup=null;}
  if(window._pasteNuevoCleanup){window._pasteNuevoCleanup();window._pasteNuevoCleanup=null;}
  Object.assign(state,p);
  render();
}
function badge(e){
  const v=ESTADOS[e]||ESTADOS.pendiente;
  return `<span class="badge" style="color:${v.color};border-color:${v.color};background:${v.bg}">${v.label}</span>`;
}
function counts(){
  return {
    pendiente:state.despachos.filter(d=>d.estado==="pendiente").length,
    entregado:state.despachos.filter(d=>d.estado==="entregado").length,
    falta_doc:state.despachos.filter(d=>d.estado==="falta_doc").length
  };
}
function dashboardData(){
  const hoy=new Date().toLocaleDateString("es-CL");
  return {
    total:state.despachos.length,
    hoy:state.despachos.filter(d=>d.fecha===hoy).length,
    sinTicket:state.despachos.filter(d=>d.estado==="entregado" && !d.ticketImg).length,
    atrasados:state.despachos.filter(d=>d.estado==="pendiente" && d.fecha!==hoy).length
  };
}
function getAgencyLabel(d){
  if(d.destino==="bodega") return "🏭 Bodega";
  if(d.destino==="oficina") return "🏢 Oficina";
  return d.agencia==="Otra..."?(d.agenciaCustom||"Otra"):d.agencia;
}
function getEmpresaLabel(d){
  return d.empresaNacional==="Otra..."?(d.empresaNacionalCustom||"Otra"):d.empresaNacional;
}
function inferDocNumber(text){
  const patterns=[
    /(cotizaci[oó]n|cotizacion)[^\d]{0,12}(\d{3,12})/i,
    /(factura)[^\d]{0,12}(\d{3,12})/i,
    /(boleta)[^\d]{0,12}(\d{3,12})/i,
    /(n[°º.]|nro|numero|folio)[^\d]{0,12}(\d{3,12})/i
  ];
  for(const re of patterns){
    const m=text.match(re);
    if(m) return m[2];
  }
  return "";
}
function inferTracking(text){
  const clean=text.replace(/\s+/g," ");
  const patterns=[
    /\b(?:tracking|seguimiento|gu[ií]a|guia|awb|n[úu]mero de env[ií]o|n[úu]mero de seguimiento)[^\d]{0,14}([A-Z0-9\-]{6,24})\b/i,
    /\b([A-Z]{2,6}\-?\d{6,18})\b/,
    /\b(\d{8,18})\b/
  ];
  for(const re of patterns){
    const m=clean.match(re);
    if(m){
      const val=(m[1]||"").trim();
      if(val.length>=6) return val;
    }
  }
  return "";
}
function inferRut(text,lines){
  let rut="";
  for(let i=0;i<lines.length;i++){
    const l=lines[i].toUpperCase();
    if(/^RUT[:\s]/.test(l)){
      const m=lines[i].match(/(\d{1,2}(?:\.\d{3}){2}-[\dkK]|\d{7,8}-[\dkK])/);
      if(m){rut=m[1];break;}
    }
  }
  if(!rut){
    const m=text.match(/\b(\d{1,2}(?:\.\d{3}){2}-[\dkK]|\d{7,8}-[\dkK])\b/);
    if(m) rut=m[1];
  }
  return rut;
}
function inferNombre(lines,text){
  let nombre="";
  for(let i=0;i<lines.length;i++){
    const l=lines[i].toUpperCase();
    if(/SE[NÑ]OR(?:ES)?|SENOR(?:ES)?|CLIENTE|DESTINATARIO|A NOMBRE|RAZON SOCIAL/.test(l)){
      const partes=lines[i].split(/:\s*/);
      if(partes.length>1 && partes[1].trim().length>2){
        nombre=partes.slice(1).join(":").trim();
      }else if(i+1<lines.length){
        nombre=lines[i+1].trim();
      }
      if(nombre) break;
    }
  }
  if(!nombre){
    const likely=lines.find(x=>/^[A-ZÁÉÍÓÚÑ0-9 .&-]{6,}$/.test(x) && !/(FACTURA|BOLETA|COTIZACION|COTIZACIÓN|RUT|FECHA|TOTAL|NETO|IVA)/i.test(x));
    if(likely) nombre=likely;
  }
  return nombre;
}
async function ocrImage(file,lang="spa"){
  const {createWorker}=Tesseract;
  const worker=await createWorker(lang);
  const {data:{text}}=await worker.recognize(file);
  await worker.terminate();
  return text;
}
async function extractDocData(file){
  const text=await ocrImage(file,"spa");
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  return {
    text,
    nombre:inferNombre(lines,text),
    rut:inferRut(text,lines),
    nDoc:inferDocNumber(text)
  };
}
async function extractTicketData(file){
  const text=await ocrImage(file,"spa");
  return {
    text,
    tracking:inferTracking(text)
  };
}
function filenameForTicket(d){
  const base=slugify(d.nombre||"cliente");
  const fecha=slugify((d.fecha||new Date().toLocaleDateString("es-CL")).replace(/\//g,"-"));
  const track=slugify(d.tracking||"");
  return track?`${base}-${fecha}-${track}.jpg`:`${base}-${fecha}.jpg`;
}
function exportCSV(){
  const head=["Nombre","RUT","Documento","Tracking","Estado","Fecha","Tipo","Destino","Agencia","Dirección","Notas"];
  const rows=state.despachos.map(d=>[
    `"${String(d.nombre||"").replace(/"/g,'""')}"`,
    `"${String(d.rut||"").replace(/"/g,'""')}"`,
    `"${String(d.nDoc||"").replace(/"/g,'""')}"`,
    `"${String(d.tracking||"").replace(/"/g,'""')}"`,
    `"${String(d.estado||"").replace(/"/g,'""')}"`,
    `"${String(d.fecha||"").replace(/"/g,'""')}"`,
    `"${String(d.tipoCompra||"").replace(/"/g,'""')}"`,
    `"${String(d.destino||"").replace(/"/g,'""')}"`,
    `"${String(getAgencyLabel(d)||"").replace(/"/g,'""')}"`,
    `"${String(d.direccionDestino||"").replace(/"/g,'""')}"`,
    `"${String(d.notas||"").replace(/"/g,'""')}"`
  ].join(","));
  const csv="\uFEFF"+head.join(",")+"\n"+rows.join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="despachos-colderman.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("CSV exportado");
}
function findPossibleDuplicate(form){
  const rutN=normalizeText(form.rut);
  const docN=normalizeText(form.nDoc);
  const nombreN=normalizeText(form.nombre);
  return state.despachos.find(d=>{
    if(form.id && d.id===form.id) return false;
    const drut=normalizeText(d.rut);
    const ddoc=normalizeText(d.nDoc);
    const dnom=normalizeText(d.nombre);
    if(rutN && docN && drut===rutN && ddoc===docN) return true;
    if(docN && nombreN && ddoc===docN && dnom===nombreN) return true;
    return false;
  });
}

// ── EXTRACCIÓN OCR DOC ────────────────────────────────────────────────────────
async function handleFile(file){
  if(!file) return;
  state.form.extractError="";
  state.form.extractSuccess="";
  state.form.extracting=true;
  state.form.statusMessage="Procesando captura...";
  render();
  setTimeout(bindNuevo,0);

  const reader=new FileReader();
  reader.onload=async e=>{
    state.form.imgPreview=e.target.result;
    render();
    setTimeout(bindNuevo,0);
    try{
      const data=await extractDocData(file);
      if(data.nombre) state.form.nombre=data.nombre;
      if(data.rut) state.form.rut=data.rut;
      if(data.nDoc) state.form.nDoc=data.nDoc;
      state.form.extracting=false;
      state.form.statusMessage="";
      if(data.nombre || data.rut || data.nDoc){
        const found=[
          data.nombre?"nombre":"",
          data.rut?"RUT":"",
          data.nDoc?"N° documento":""
        ].filter(Boolean).join(", ");
        state.form.extractSuccess=`✅ Datos encontrados: ${found}`;
      }else{
        state.form.extractError="No se pudo extraer. Rellena manualmente.";
      }
    }catch(err){
      console.error(err);
      state.form.extracting=false;
      state.form.statusMessage="";
      state.form.extractError="No se pudo extraer. Rellena manualmente.";
    }
    render();
    setTimeout(bindNuevo,0);
  };
  reader.readAsDataURL(file);
}

// ── GUARDAR ───────────────────────────────────────────────────────────────────
function guardar(){
  const f=state.form;
  if(!f.nombre.trim()){
    showToast("Falta el nombre del cliente");
    return;
  }
  if(f.destino==="provincia" && !f.agencia){
    showToast("Selecciona una agencia para provincia");
    return;
  }

  const dup=findPossibleDuplicate(f);
  if(dup){
    const seguir=confirm(`Parece duplicado:\n${dup.nombre}${dup.nDoc?" · N° "+dup.nDoc:""}\n\n¿Guardar igual?`);
    if(!seguir) return;
  }

  const existe=state.despachos.find(d=>d.id===f.id);
  const base={
    id:existe?f.id:Date.now(),
    fbKey:existe?(f.fbKey||existe.fbKey||""):(f.fbKey||""),
    ts:Date.now(),
    nombre:f.nombre.trim(),
    rut:f.rut.trim(),
    nDoc:(f.nDoc||"").trim(),
    bultos:f.bultos||"",
    tracking:(f.tracking||"").trim(),
    docImg:f.imgPreview||"",
    tipoCompra:f.tipoCompra,
    empresaNacional:f.empresaNacional,
    empresaNacionalCustom:(f.empresaNacionalCustom||"").trim(),
    destino:f.destino,
    agencia:f.agencia,
    agenciaCustom:(f.agenciaCustom||"").trim(),
    direccionDestino:(f.direccionDestino||"").trim(),
    region:f.region||"",
    notas:(f.notas||"").trim(),
    ticketImg:existe?(f.ticketImg||existe.ticketImg||""):(f.ticketImg||""),
    estado:existe?(f.estado||existe.estado||"pendiente"):"pendiente",
    fecha:existe?(f.fecha||existe.fecha):new Date().toLocaleDateString("es-CL"),
    historial:existe
      ? addHistory(existe,"Despacho editado","Se actualizaron datos del despacho")
      : addHistory(baseDummy(),"Despacho creado","Creación inicial")
  };

  if(existe){
    dbActualizar(base);
    showToast("Despacho editado");
  }else{
    dbGuardar(base);
    showToast("Despacho guardado");
  }

  setState({view:"lista",form:emptyForm()});
}
function baseDummy(){
  return {historial:[]};
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  if(state.view==="nuevo"){
    app.innerHTML=renderNuevo();
    bindNuevo();
    return;
  }
  if(state.view==="detalle"){
    app.innerHTML=renderDetalle();
    bindDetalle();
    return;
  }
  app.innerHTML=renderLista();
  bindLista();
}

    uploadArea.classList.add("dragover");
  });
  uploadArea.addEventListener("dragleave",()=>{
    uploadArea.classList.remove("dragover");
  });
  uploadArea.addEventListener("drop",e=>{
    e.preventDefault();
    uploadArea.classList.remove("dragover");
    const file=e.dataTransfer.files?.[0];
    if(file && file.type.startsWith("image/")) handleFile(file);
  });

  const onPasteNuevo=e=>{
    const items=e.clipboardData?.items;
    if(!items) return;
    for(const item of items){
      if(item.type.startsWith("image/")){
        e.preventDefault();
        handleFile(item.getAsFile());
        break;
      }
    }
  };
  document.addEventListener("paste",onPasteNuevo);
  window._pasteNuevoCleanup=()=>document.removeEventListener("paste",onPasteNuevo);

  document.getElementById("fNombre").oninput=e=>{state.form.nombre=e.target.value;};
  document.getElementById("fRut").oninput=e=>{state.form.rut=e.target.value;};
  document.getElementById("fNDoc").oninput=e=>{state.form.nDoc=e.target.value;};
  document.getElementById("fBultos").oninput=e=>{state.form.bultos=e.target.value;};
  document.getElementById("fTracking").oninput=e=>{state.form.tracking=e.target.value;};

  document.getElementById("tabImport").onclick=()=>{state.form.tipoCompra="importacion";re();};
  document.getElementById("tabNacional").onclick=()=>{state.form.tipoCompra="nacional";re();};
  document.getElementById("tabProvincia").onclick=()=>{state.form.destino="provincia";re();};
  document.getElementById("tabOficina").onclick=()=>{state.form.destino="oficina";re();};
  document.getElementById("tabBodega").onclick=()=>{state.form.destino="bodega";re();};

  const fn=document.getElementById("fEmpresaNacional");
  if(fn) fn.onchange=e=>{state.form.empresaNacional=e.target.value;re();};

  const fc=document.getElementById("fEmpresaCustom");
  if(fc) fc.oninput=e=>{state.form.empresaNacionalCustom=e.target.value;};

  const fa=document.getElementById("fAgencia");
  if(fa) fa.onchange=e=>{state.form.agencia=e.target.value;re();};

  const fac=document.getElementById("fAgenciaCustom");
  if(fac) fac.oninput=e=>{state.form.agenciaCustom=e.target.value;};

  const fd=document.getElementById("fDireccion");
  if(fd) fd.oninput=e=>{state.form.direccionDestino=e.target.value;};

  const fno=document.getElementById("fNotas");
  if(fno) fno.oninput=e=>{state.form.notas=e.target.value;};

  document.getElementById("btnGuardar").onclick=guardar;
}

// ── DETALLE ───────────────────────────────────────────────────────────────────
function renderDetalle(){
  const d=state.despachos.find(x=>x.id===state.selectedId);
  if(!d) return renderLista();

  const empresaLabel=getEmpresaLabel(d);
  const agenciaLabel=getAgencyLabel(d);
  const destinoLabel=d.destino==="provincia"?"📦 Envío a provincia":d.destino==="oficina"?"🏢 Recepción en oficina":"🏭 Recojo en bodega";

  return `
    <div class="header">
      <button class="btn-back" id="btnBack">←</button>
      <span style="font-weight:700;font-size:16px">Detalle</span>
      <button class="btn-delete" id="btnDelete">🗑</button>
    </div>

    <div class="page">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn-primary" id="btnEditar">✏️ Editar</button>
        <button class="btn-secondary" id="btnExportOne">⬇️ Descargar ticket</button>
      </div>

      <div style="background:#1a1a1a;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a2a2a">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px">
          <div>
            <div style="font-size:18px;font-weight:800">${d.nombre}</div>
            ${d.rut?`<div style="color:#888;font-size:13px">RUT: ${d.rut}</div>`:""}
          </div>
          ${badge(d.estado)}
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          ${d.nDoc?`<span class="pill">📄 N° ${d.nDoc}</span>`:""}
          ${d.tracking?`<span class="pill">🚚 ${d.tracking}</span>`:""}
          ${d.ticketImg?`<span class="pill">🧾 Ticket cargado</span>`:`<span class="pill">🧾 Sin ticket</span>`}
        </div>

        <div class="row"><span class="lbl">Tipo</span><span class="val">${d.tipoCompra==="importacion"?"🌏 Importación":"🇨🇱 Compra nacional"}</span></div>
        ${empresaLabel?`<div class="row"><span class="lbl">Empresa</span><span class="val">${empresaLabel}</span></div>`:""}
        <div class="row"><span class="lbl">Destino</span><span class="val">${destinoLabel}</span></div>
        ${agenciaLabel?`<div class="row"><span class="lbl">Agencia</span><span class="val">${agenciaLabel}</span></div>`:""}
        ${d.direccionDestino?`<div class="row"><span class="lbl">Dirección</span><span class="val">${d.direccionDestino}</span></div>`:""}
        ${d.region?`<div class="row"><span class="lbl">Región</span><span class="val">${d.region}</span></div>`:""}
        ${d.bultos?`<div class="row"><span class="lbl">Bultos</span><span class="val">${d.bultos}</span></div>`:""}
        ${d.notas?`<div class="row"><span class="lbl">Notas</span><span class="val">${d.notas}</span></div>`:""}
        <div class="row"><span class="lbl">Ingresado</span><span class="val">${d.fecha||""}</span></div>
      </div>

      <div style="font-size:13px;color:#aaa;font-weight:700;margin:16px 0 10px">DOCUMENTO</div>
      ${d.docImg
        ? `<img src="${d.docImg}" id="docMiniatura" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:16px;cursor:pointer" title="Toca para ver completo" />`
        : `<div style="color:#555;font-size:13px;margin-bottom:16px">Sin documento adjunto.</div>`}

      <div style="font-size:13px;color:#aaa;font-weight:700;margin-bottom:10px">CAMBIAR ESTADO</div>
      ${Object.entries(ESTADOS).map(([k,v])=>`
        <button class="btn-estado" data-estado="${k}" data-fbkey="${d.fbKey||""}"
          style="color:${v.color};border-color:${d.estado===k?v.color:"#333"};background:${d.estado===k?v.bg:"#1a1a1a"}">
          ${d.estado===k?"✓ ":""}${v.label}
        </button>`).join("")}

      <div style="font-size:13px;color:#aaa;font-weight:700;margin:18px 0 10px">TICKET DE ENTREGA</div>
      ${d.ticketImg
        ? `<img src="${d.ticketImg}" style="width:100%;border-radius:12px;margin-bottom:10px" id="ticketImgEl" />
           <div style="display:flex;gap:8px;margin-bottom:10px">
             <button id="btnWhatsapp"
               class="btn-primary"
               style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#25D366">
               📲 WhatsApp
             </button>
             <a id="btnDescargar" href="${d.ticketImg}" download="${filenameForTicket(d)}"
               class="btn-secondary"
               style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none">
               ⬇️ Descargar
             </a>
           </div>`
        : `<div style="color:#555;font-size:13px;margin-bottom:10px">No hay foto del ticket aún.</div>`}

      <div class="upload-area" id="ticketUpload" style="margin-bottom:8px">
        <div style="font-size:24px">📷</div>
        <div style="color:#ddd;font-size:13px;margin-top:4px;font-weight:700">${d.ticketImg?"Cambiar foto del ticket":"Subir foto del ticket"}</div>
        <div style="color:#777;font-size:12px;margin-top:6px">También puedes pegar una imagen con <span class="kdb">Ctrl+V</span></div>
      </div>

      <input type="file" id="ticketFileInput" accept="image/*" capture="environment" style="display:none" />

      <div style="font-size:13px;color:#aaa;font-weight:700;margin:18px 0 10px">HISTORIAL</div>
      ${(Array.isArray(d.historial) && d.historial.length)
        ? d.historial.map(h=>`
            <div class="history-item">
              <div class="history-type">${h.tipo}</div>
              ${h.nota?`<div class="history-note">${h.nota}</div>`:""}
              <div class="history-date">${h.fecha||""}</div>
            </div>`).join("")
        : `<div style="color:#555;font-size:13px">Sin historial aún.</div>`
      }
    </div>`;
}

function bindDetalle(){
  const d=state.despachos.find(x=>x.id===state.selectedId);
  if(!d) return;

  document.getElementById("btnBack").onclick=()=>setState({view:"lista"});

  document.getElementById("btnDelete").onclick=()=>{
    if(confirm("¿Eliminar este despacho?")) dbEliminar(state.selectedId,d?.fbKey);
  };

  document.getElementById("btnEditar").onclick=()=>{
    setState({
      view:"nuevo",
      form:{
        ...emptyForm(),
        ...d,
        imgPreview:d.docImg||null
      }
    });
  };

  document.getElementById("btnExportOne").onclick=()=>{
    if(d.ticketImg){
      const a=document.createElement("a");
      a.href=d.ticketImg;
      a.download=filenameForTicket(d);
      a.click();
    }else{
      showToast("Este despacho no tiene ticket");
    }
  };

  document.querySelectorAll(".btn-estado").forEach(btn=>{
    btn.onclick=()=>{
      const nuevoEstado=btn.dataset.estado;
      if(nuevoEstado==="entregado" && !d.ticketImg){
        const seguir=confirm("Este despacho se marcará como entregado sin ticket. ¿Continuar?");
        if(!seguir) return;
      }
      dbEstado(state.selectedId,btn.dataset.fbkey,nuevoEstado);
    };
  });

  const docMini=document.getElementById("docMiniatura");
  if(docMini && d.docImg){
    docMini.onclick=()=>{
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px";
      overlay.innerHTML=`<img src="${d.docImg}" style="max-width:100%;max-height:100%;border-radius:12px" /><button style="position:fixed;top:16px;right:16px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer">✕</button>`;
      overlay.onclick=()=>overlay.remove();
      document.body.appendChild(overlay);
    };
  }

  const btnWa=document.getElementById("btnWhatsapp");
  if(btnWa){
    btnWa.onclick=async(e)=>{
      e.preventDefault();
      try{
        const text=`Hola, ${d.nombre}. Tu despacho fue enviado.`;
        if(d.ticketImg && navigator.share){
          const res=await fetch(d.ticketImg);
          const blob=await res.blob();
          const file=new File([blob],filenameForTicket(d),{type:blob.type||"image/jpeg"});
          await navigator.share({text,files:[file]});
        }else if(navigator.share){
          await navigator.share({text});
        }else{
          window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text)," _blank");
        }
      }catch(err){
        if(err.name!=="AbortError"){
          const text=`Hola, ${d.nombre}. Tu despacho fue enviado.`;
          window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text),"_blank");
        }
      }
    };
  }

  document.getElementById("ticketUpload").onclick=()=>document.getElementById("ticketFileInput").click();
  document.getElementById("ticketFileInput").onchange=e=>guardarTicket(e.target.files[0]);

  const onPaste=e=>{
    const items=e.clipboardData?.items;
    if(!items) return;
    for(const item of items){
      if(item.type.startsWith("image/")){
        e.preventDefault();
        guardarTicket(item.getAsFile());
        break;
      }
    }
  };
  document.addEventListener("paste",onPaste);
  window._pasteCleanup=()=>document.removeEventListener("paste",onPaste);
}

// ── GUARDAR TICKET ────────────────────────────────────────────────────────────
function guardarTicket(file){
  if(!file) return;
  const d=state.despachos.find(x=>x.id===state.selectedId);
  if(!d) return;

  showToast("Procesando ticket...");
  const reader=new FileReader();

  reader.onload=async ev=>{
    let tracking=d.tracking||"";
    try{
      const tData=await extractTicketData(file);
      if(tData.tracking) tracking=tData.tracking;
    }catch(err){
      console.error("OCR ticket:",err);
    }

    const nuevo={
      ...d,
      ticketImg:ev.target.result,
      tracking,
      historial:addHistory(d,"Ticket cargado",tracking?`Tracking detectado: ${tracking}`:"Se cargó ticket de entrega")
    };

    dbActualizar(nuevo);
    showToast(tracking?`Ticket cargado · Tracking ${tracking}`:"Ticket cargado");
  };

  reader.readAsDataURL(file);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
const t=document.createElement("script");
t.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
document.head.appendChild(t);

if(window._firebaseReady){
  initStorage();
}else{
  window.addEventListener("firebaseReady",initStorage);
  setTimeout(initStorage,3000);
}
</script>
