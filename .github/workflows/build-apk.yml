name: Construir APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Configurar plugin OneSignal (gradle)
        run: python3 scripts/onesignal_gradle.py

      - name: Sincronizar plugins con Android
        run: npx cap sync android

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: despachos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
